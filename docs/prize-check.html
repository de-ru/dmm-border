
<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <meta name="theme-color" content="#f1f5f9">
        <meta name="color-scheme" content="light dark">
        <title>あまり玉・収支計算</title>
        <style>
            :root {
                --bg: #f1f5f9;
                --panel: #fff;
                --sub: #f8fafc;
                --text: #0f172a;
                --muted: #64748b;
                --border: #d8e1ec;
                --brand: #2563eb;
                --soft: #eff6ff;
                --shadow: 0 7px 22px rgba(15, 23, 42, .06)
            }

            * {
                box-sizing: border-box
            }

            html {
                -webkit-text-size-adjust: 100%;
                text-size-adjust: 100%
            }

            body {
                margin: 0;
                min-width: 320px;
                background: var(--bg);
                color: var(--text);
                font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif
            }

            button,
            input {
                font: inherit
            }

            button {
                cursor: pointer;
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent
            }

            .app {
                width: 100%;
                min-height: 100dvh;
                padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left))
            }

            .container {
                width: 100%;
                max-width: 540px;
                margin: auto
            }

            .header {
                padding: 2px 3px 4px
            }

            .eyebrow {
                color: var(--brand);
                font-size: 12px;
                font-weight: 900;
                letter-spacing: .12em
            }

            h1 {
                margin: 5px 0 6px;
                font-size: clamp(25px, 8vw, 34px);
                line-height: 1.2
            }

            .description,
            .hint {
                color: var(--muted);
                font-size: 12px;
                line-height: 1.65
            }

            .description {
                margin: 0
            }

            .card {
                min-width: 0;
                margin-top: 13px;
                padding: 16px;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 18px;
                box-shadow: var(--shadow)
            }

            .tabs {
                display: flex;
                gap: 5px;
                padding: 4px;
                background: var(--bg);
                border-radius: 14px
            }

            .tab {
                flex: 1;
                min-height: 46px;
                padding: 10px;
                color: var(--muted);
                font-weight: 900;
                background: transparent;
                border: 0;
                border-radius: 10px
            }

            .tab.active {
                color: #fff;
                background: #0f172a
            }

            .section-title {
                display: block;
                margin: 17px 0 8px;
                font-size: 13px;
                font-weight: 900
            }

            .chips {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px
            }

            .chip {
                width: 100%;
                min-height: 44px;
                padding: 8px 10px;
                color: #334155;
                font-size: 13px;
                font-weight: 800;
                background: var(--panel);
                border: 1px solid #cbd5e1;
                border-radius: 999px
            }

            .chip.active {
                color: #1d4ed8;
                background: var(--soft);
                border-color: var(--brand)
            }

            .form-grid {
                display: grid;
                grid-template-columns: 1fr;
                gap: 14px
            }

            label {
                display: block;
                margin-bottom: 6px;
                font-size: 13px;
                font-weight: 800
            }

            .input-wrap {
                position: relative
            }

            input {
                width: 100%;
                min-height: 50px;
                padding: 11px 54px 11px 13px;
                color: var(--text);
                font-size: 16px;
                font-weight: 800;
                background: var(--panel);
                border: 1px solid #cbd5e1;
                border-radius: 12px;
                outline: none
            }

            input:focus {
                border-color: var(--brand);
                box-shadow: 0 0 0 3px rgba(37, 99, 235, .14)
            }

            button:focus-visible,
            input:focus-visible {
                outline: 3px solid rgba(37, 99, 235, .28);
                outline-offset: 2px
            }

            .suffix {
                position: absolute;
                top: 50%;
                right: 14px;
                color: var(--muted);
                font-size: 12px;
                font-weight: 800;
                pointer-events: none;
                transform: translateY(-50%)
            }

            .example {
                margin: 10px 0 0
            }

            .hero {
                padding: 18px;
                color: #fff;
                background: linear-gradient(135deg, #0f172a, #1e3a8a);
                border-radius: 16px
            }

            .hero-label {
                color: #bfdbfe;
                font-size: 12px;
                font-weight: 800
            }

            .profit {
                margin-top: 4px;
                overflow-wrap: anywhere;
                font-size: clamp(32px, 11vw, 42px);
                font-weight: 950;
                line-height: 1.18
            }

            .profit-note {
                margin-top: 5px;
                color: #dbeafe;
                font-size: 13px;
                line-height: 1.5
            }

            .results {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 9px;
                margin-top: 10px
            }

            .result {
                min-width: 0;
                padding: 13px;
                background: var(--sub);
                border-radius: 12px
            }

            .result small {
                display: block;
                color: var(--muted);
                font-size: 12px;
                font-weight: 800
            }

            .result strong {
                display: block;
                margin-top: 4px;
                overflow-wrap: anywhere;
                font-size: clamp(18px, 6vw, 22px)
            }

            .details {
                margin-top: 10px;
                padding: 8px 13px;
                font-size: 13px;
                background: var(--sub);
                border-radius: 12px
            }

            .detail-row {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                align-items: baseline;
                gap: 10px;
                padding: 7px 0;
                border-bottom: 1px solid rgba(148, 163, 184, .2)
            }

            .detail-row:last-child {
                border-bottom: 0
            }

            .detail-row span {
                color: var(--muted)
            }

            .detail-row strong {
                max-width: 180px;
                text-align: right;
                overflow-wrap: anywhere
            }

            .error {
                margin-top: 10px;
                padding: 11px;
                color: #b91c1c;
                font-size: 13px;
                font-weight: 800;
                line-height: 1.5;
                background: #fef2f2;
                border: 1px solid #fecaca;
                border-radius: 10px
            }

            .hidden {
                display: none
            }

            .footer {
                margin: 0;
                padding: 14px 8px 4px;
                text-align: center
            }

            @media(max-width:350px) {
                .app {
                    padding-left: 10px;
                    padding-right: 10px
                }

                .card {
                    padding: 14px
                }

                .chips,
                .results {
                    grid-template-columns: 1fr
                }

                .detail-row {
                    grid-template-columns: 1fr;
                    gap: 3px
                }

                .detail-row strong {
                    max-width: none;
                    text-align: left
                }
            }

            @media(min-width:600px) {
                .container {
                    max-width: 720px
                }

                .form-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr))
                }

                .chips {
                    display: flex;
                    flex-wrap: wrap
                }

                .chip {
                    width: auto;
                    min-width: 92px;
                    padding-left: 15px;
                    padding-right: 15px
                }
            }

            @media(prefers-color-scheme:dark) {
                :root {
                    --bg: #020617;
                    --panel: #0f172a;
                    --sub: #1e293b;
                    --text: #e2e8f0;
                    --muted: #94a3b8;
                    --border: #334155;
                    --soft: #172554;
                    --shadow: none
                }

                input,
                .chip {
                    color: #f8fafc;
                    background: #111827;
                    border-color: #475569
                }

                .chip.active {
                    color: #bfdbfe;
                    background: #172554;
                    border-color: #60a5fa
                }

                .error {
                    color: #fecaca;
                    background: #450a0a;
                    border-color: #7f1d1d
                }
            }
        </style>
    </head>

    <body>
        <div id="rate-app" class="app">
            <main class="container">
                <header class="header">
                    <div class="eyebrow">PACHINKO / SLOT</div>
                    <h1>あまり玉・収支計算</h1>
                    <p class="description">貸出数と1,000円単位の交換率から、景品交換額・収支・あまり玉を計算します。</p>
                </header>
                <section class="card" aria-label="交換条件">
                    <div class="tabs" role="tablist" aria-label="遊技種別"><button type="button" class="tab active" role="tab" aria-selected="true" data-mode="p">パチンコ</button><button type="button" class="tab" role="tab" aria-selected="false" data-mode="s">スロット</button></div>
                    <span class="section-title">貸出枚数・貸出玉数</span>
                    <div id="lend-chips" class="chips"></div>
                    <span class="section-title">交換率プリセット</span>
                    <div id="exchange-chips" class="chips"></div>
                    <div class="form-grid" style="margin-top:17px">
                        <div><label for="lend">1,000円あたりの貸出数</label>
                            <div class="input-wrap"><input id="lend" type="number" inputmode="decimal" min="0.01" max="1000000000" step="0.01"><span class="suffix unit">玉</span></div>
                        </div>
                        <div><label for="exchange">1,000円の交換に必要な数</label>
                            <div class="input-wrap"><input id="exchange" type="number" inputmode="decimal" min="0.01" max="1000000000" step="0.01"><span class="suffix unit">玉</span></div>
                        </div>
                    </div>
                    <p id="example" class="hint example"></p>
                </section>
                <section class="card" aria-label="獲得数と投資金額">
                    <div class="form-grid">
                        <div><label id="held-label" for="held">獲得玉数</label>
                            <div class="input-wrap"><input id="held" type="number" inputmode="numeric" min="0" max="1000000000" step="1" value="5000"><span class="suffix unit">玉</span></div>
                        </div>
                        <div><label for="invest">投資金額</label>
                            <div class="input-wrap"><input id="invest" type="number" inputmode="numeric" min="0" max="1000000000" step="100" value="10000"><span class="suffix">円</span></div>
                        </div>
                    </div>
                    <div style="margin-top:14px"><label for="prize">景品交換の最小金額</label>
                        <div class="input-wrap"><input id="prize" type="number" inputmode="numeric" min="1" max="1000000000" step="100" value="1000"><span class="suffix">円</span></div>
                    </div>
                </section>
                <section class="card" aria-label="計算結果" aria-live="polite">
                    <div class="hero">
                        <div class="hero-label">交換後の収支</div>
                        <div id="profit" class="profit">0円</div>
                        <div id="profit-note" class="profit-note"></div>
                    </div>
                    <div class="results">
                        <div class="result"><small>景品交換額</small><strong id="cash">0円</strong></div>
                        <div class="result"><small id="remain-title">あまり玉</small><strong id="remain">0玉</strong></div>
                    </div>
                    <div class="details">
                        <div class="detail-row"><span>端数込み交換価値</span><strong id="raw">0円</strong></div>
                        <div class="detail-row"><span>投入相当数</span><strong id="borrowed">0玉</strong></div>
                        <div class="detail-row"><span>貸出単価</span><strong id="lend-rate">0円／玉</strong></div>
                        <div class="detail-row"><span>交換単価</span><strong id="exchange-rate">0円／玉</strong></div>
                    </div>
                    <div id="error" class="error hidden" role="alert"></div>
                </section>
                <p class="hint footer">実際の交換条件や景品構成は店舗ごとにご確認ください。</p>
            </main>
        </div>
        <script>
            (() => {
                "use strict";
                const root = document.getElementById("rate-app");
                if (!root || root.dataset.initialized === "true") return;
                root.dataset.initialized = "true";
                const $ = s => root.querySelector(s),
                    $$ = s => [...root.querySelectorAll(s)];
                const config = {
                    p: {
                        unit: "玉",
                        heldLabel: "獲得玉数",
                        remainLabel: "あまり玉",
                        example: "例：28玉交換は、1,000円の交換に280玉必要です。任意の交換条件も直接入力できます。",
                        lend: [
                            ["4パチ", 250],
                            ["2パチ", 500],
                            ["1パチ", 1000],
                            ["0.5パチ", 2000],
                            ["手動", null]
                        ],
                        exchange: [
                            ["等価", 250],
                            ["27.5玉", 275],
                            ["28玉", 280],
                            ["30玉", 300],
                            ["手動", null]
                        ]
                    },
                    s: {
                        unit: "枚",
                        heldLabel: "獲得枚数",
                        remainLabel: "あまりメダル",
                        example: "例：5.1枚交換は51枚、5.5枚交換は55枚です。任意の交換条件も直接入力できます。",
                        lend: [
                            ["46枚", 46],
                            ["50枚", 50],
                            ["手動", null]
                        ],
                        exchange: [
                            ["等価", 50],
                            ["5.1枚", 51],
                            ["5.2枚", 52],
                            ["5.5枚", 55],
                            ["手動", null]
                        ]
                    }
                };
                let mode = "p";
                const num = s => Number($(s).value),
                    yen = v => Math.round(v).toLocaleString("ja-JP") + "円",
                    qty = (v, u) => v.toLocaleString("ja-JP", {
                        maximumFractionDigits: 2
                    }) + u,
                    rate = (v, u) => v.toLocaleString("ja-JP", {
                        minimumFractionDigits: 2,
                        maximumFractionDigits: 2
                    }) + "円／" + u;

                function sync(box, input, items) {
                    const v = num(input),
                        has = items.some(x => x[1] !== null && x[1] === v);
                    $$(`${box} .chip`).forEach((b, i) => {
                        const p = items[i][1],
                            on = p === null ? !has : p === v;
                        b.classList.toggle("active", on);
                        b.setAttribute("aria-pressed", String(on))
                    })
                }

                function render(box, items, input) {
                    const c = $(box);
                    c.replaceChildren();
                    items.forEach(item => {
                        const b = document.createElement("button");
                        b.type = "button";
                        b.className = "chip";
                        b.textContent = item[0];
                        b.setAttribute("aria-pressed", "false");
                        b.addEventListener("click", () => {
                            if (item[1] === null) {
                                sync(box, input, items);
                                $(input).focus();
                                $(input).select();
                                return
                            }
                            $(input).value = item[1];
                            sync(box, input, items);
                            calc()
                        });
                        c.appendChild(b)
                    });
                    sync(box, input, items)
                }

                function setMode(next) {
                    mode = next;
                    const c = config[mode];
                    $$('.tab').forEach(b => {
                        const on = b.dataset.mode === mode;
                        b.classList.toggle('active', on);
                        b.setAttribute('aria-selected', String(on))
                    });
                    $$('.unit').forEach(e => e.textContent = c.unit);
                    $('#held-label').textContent = c.heldLabel;
                    $('#remain-title').textContent = c.remainLabel;
                    $('#example').textContent = c.example;
                    $('#lend').value = c.lend[0][1];
                    $('#exchange').value = c.exchange[0][1];
                    render('#lend-chips', c.lend, '#lend');
                    render('#exchange-chips', c.exchange, '#exchange');
                    calc()
                }

                function clear() {
                    const u = config[mode].unit;
                    $('#profit').textContent = '0円';
                    $('#profit').style.color = '#fff';
                    $('#profit-note').textContent = '入力内容を確認してください';
                    $('#cash').textContent = $('#raw').textContent = '0円';
                    $('#remain').textContent = $('#borrowed').textContent = '0' + u;
                    $('#lend-rate').textContent = $('#exchange-rate').textContent = '0円／' + u
                }

                function error(msg) {
                    clear();
                    $('#error').textContent = msg;
                    $('#error').classList.remove('hidden')
                }

                function calc() {
                    const lend = num('#lend'),
                        ex = num('#exchange'),
                        held = num('#held'),
                        invest = num('#invest'),
                        prize = num('#prize'),
                        values = [lend, ex, held, invest, prize];
                    if (!values.every(Number.isFinite)) {
                        error('すべての項目に数値を入力してください。');
                        return
                    }
                    if (lend <= 0 || ex <= 0 || prize <= 0 || held < 0 || invest < 0) {
                        error('貸出数・交換数・最小景品額は0より大きい値、獲得数・投資額は0以上で入力してください。');
                        return
                    }
                    if (values.some(v => v > 1000000000)) {
                        error('入力できる数値の上限は10億です。');
                        return
                    }
                    $('#error').classList.add('hidden');
                    const u = config[mode].unit,
                        raw = held / ex * 1000,
                        cash = Math.floor((raw + 1e-9) / prize) * prize,
                        used = cash / 1000 * ex,
                        remain = Math.max(0, held - used),
                        profit = cash - invest;
                    $('#cash').textContent = yen(cash);
                    $('#raw').textContent = yen(raw);
                    $('#remain').textContent = qty(remain, u);
                    $('#borrowed').textContent = qty(invest / 1000 * lend, u);
                    $('#lend-rate').textContent = rate(1000 / lend, u);
                    $('#exchange-rate').textContent = rate(1000 / ex, u);
                    $('#profit').textContent = (profit > 0 ? '+' : '') + yen(profit);
                    $('#profit').style.color = profit > 0 ? '#86efac' : profit < 0 ? '#fca5a5' : '#fff';
                    $('#profit-note').textContent = '投資 ' + yen(invest) + 'を差し引いた結果'
                }
                $$('.tab').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
                $('#lend').addEventListener('input', () => {
                    sync('#lend-chips', '#lend', config[mode].lend);
                    calc()
                });
                $('#exchange').addEventListener('input', () => {
                    sync('#exchange-chips', '#exchange', config[mode].exchange);
                    calc()
                });
                ['#held', '#invest', '#prize'].forEach(s => $(s).addEventListener('input', calc));
                setMode('p')
            })();
        </script>
    </body>

</html>
